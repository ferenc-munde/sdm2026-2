<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Last Train — renderer check</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #101018;
        color: #e6e6ee;
        font-family: system-ui, sans-serif;
      }

      #app {
        width: 100vw;
        height: 100vh;
      }

      .title {
        position: fixed;
        bottom: 16px;
        left: 16px;
        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(16, 16, 24, 0.7);
        pointer-events: none;
      }

      .title h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }

      .title p {
        margin: 4px 0 0;
        font-size: 12px;
        opacity: 0.7;
      }

      /* Heads-up display (#20): three bars across the top of the screen. */
      .hud {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 16px;
        width: min(860px, calc(100vw - 32px));
        padding: 10px 14px;
        border-radius: 10px;
        background: rgba(16, 16, 24, 0.78);
        pointer-events: none;
      }

      .hud-bar {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 8px;
        flex: 1;
        font-size: 12px;
      }

      .hud-bar-label {
        opacity: 0.75;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .hud-bar-value {
        min-width: 6ch;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .hud-bar-track {
        height: 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        overflow: hidden;
      }

      .hud-bar-fill {
        height: 100%;
        width: 0;
        border-radius: inherit;
        transition: width 120ms linear, background 120ms linear;
      }
    </style>
  </head>
  <body>
    <div class="title">
      <h1>The Last Train</h1>
      <p>Renderer and HUD check (#10, #20)</p>
    </div>
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
