<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Last Train</title>
  </head>
  <body>
    <div id="scene"></div>
    <div id="hud"></div>
    <aside id="demo-controls">
      <strong>THE LAST TRAIN · LOCAL SCENE DEMO</strong>
      <p>2D top-down view · Example controls · No multiplayer connected</p>
      <label for="view-mode">Data source</label>
      <select id="view-mode">
        <option value="local">Local rules</option>
        <option value="preview">Scene preview (example data)</option>
      </select>
      <output id="status" aria-live="off">Starting local adapter…</output>
      <div class="map-controls">
        <label for="map-car">Inspect map</label>
        <select id="map-car" aria-describedby="map-description">
          <option value="all">Whole train</option>
          <option value="0">1 · Command & Guidance</option>
          <option value="1">2 · Boiler Room</option>
          <option value="2">3 · Mechanical Junction</option>
          <option value="3">4 · Cargo Hold</option>
          <option value="4">5 · Caboose / Generator</option>
        </select>
        <span id="map-description">Four open bulkheads connect the five carriages. Gold squares mark relief hatches.</span>
      </div>
      <div class="motion-controls">
        <label for="speed">Demo speed</label>
        <input id="speed" type="range" min="0" max="2" step="0.1" value="1">
        <output id="speed-value" for="speed">1.0x</output>
        <button id="pause-motion" aria-pressed="false">Pause scenery</button>
      </div>
      <button id="travel">Travel +10%</button>
      <button id="elapsed">Time +30 seconds</button>
      <button id="repair">Example repair</button>
      <button id="dock">Preview docking</button>
      <button id="fail">Preview defeat</button>
      <button id="restart">Reset demo</button>
    </aside>
    <script type="module" src="/client/main.ts"></script>
  </body>
</html>
