name: Team 2 Feature CI

on:
  push:
    branches:
      - Team_2_Feature
  pull_request:
    branches:
      - development

permissions:
  contents: read

concurrency:
  group: team-2-feature-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-server:
    if: github.event_name == 'push' || github.head_ref == 'Team_2_Feature'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip pytest
          if [[ -f server/requirements.txt ]]; then
            python -m pip install -r server/requirements.txt
          fi

      - name: Test Python server
        run: |
          if ! find server -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            echo "::error::No Python tests found under server/."
            exit 1
          fi
          python -m pytest server

  threejs-frontend:
    if: github.event_name == 'push' || github.head_ref == 'Team_2_Feature'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/team-2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check frontend manifests
        run: |
          if [[ ! -f package.json ]]; then
            echo "::error::games/team-2 must contain package.json."
            exit 1
          fi

      - name: Install dependencies
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi

      - name: Test frontend
        run: npm test

      - name: Type-check frontend
        run: npm run typecheck --if-present

      - name: Build frontend
        run: npm run build --if-present
