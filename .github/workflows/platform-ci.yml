name: Platform CI

on:
  push:
    branches:
      - development
      - staging
      - main
  pull_request:
    branches:
      - development
      - staging
      - main

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check the platform packages
        run: pnpm --filter "./server/*" --if-present run typecheck

      - name: Test the platform packages
        run: pnpm --filter "./server/*" --if-present run test
